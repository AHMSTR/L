    .footer-section { max-width: 522px; margin: 58.8px auto 0 auto; }
    .footer-container {
      border-radius:; padding: 19.6px 19.6px 0 19.6px;

      box-shadow: 0 -4px 8px -4px #DDD;
    }
    .copyright-btn {
      width: 100%;
      background: #EEE; color: #555; border: none; 
      padding: 0; border-radius:;
      font-size: 0.90500299686rem; font-weight: 400; letter-spacing: 0.487926388845px;
      font-family: "Atkinson Hyperlegible", sans-serif;
      box-shadow:;
      transition: all 0.2s ease; text-align: center; cursor: default;
    }
    .copyright-btn:hover { box-shadow:; }

    @media (max-width: 768px) {

      .btn { padding: 9.996px 21.9912px; font-size: 0.78401115738rem; letter-spacing: 0.67138134px; border-radius: 49px; }
      .image-container { margin-top: 39.2px; padding: 12.6px; border-radius: 39.2px; }
      .contact-section { margin-top: 35.28px; max-width: 100%; }
      .contact-container { padding: 26.46px 26.46px; border-radius: 35.28px; }
      .contact-header { margin-bottom: 18.522px; }
      .contact-title { font-size: 1.1319rem; letter-spacing: 0.690851399px; }
      .contact-subtitle { font-size: 14.07672px; letter-spacing: 0.351918px; }
      
      .contact-form input,
      .contact-form textarea { font-size: 14.07672px; }

      .contact-form { gap: 8.1px; }
      .success-message { padding: 10.71px 17.1px; border-radius: 18px; font-size: 13.4064px; }

      .footer-section { margin-top: 39.2px; max-width: 100%; }
      .footer-container { padding: 12.6px 12.6px 0 12.6px; border-radius:; }
      .copyright-btn { 
        font-size: 0.78401115738rem; 
        padding: 0; 
        border-radius:; 
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="https://linksco.co.za" class="logo">LINKSCO</a>
      <a href="mailto:info@linksco.co.za" class="btn">GET IN TOUCH</a>
    </header>

    <div class="image-container">
      <img src="pramod-tiwari--HE_g2BcZ_A-unsplash.jpg" alt="Hero image" draggable="false" oncontextmenu="return false">
    </div>

    <section id="contact" class="contact-section">
      <div class="contact-container">
        <div class="contact-header">
          <h2 class="contact-title">CONTACT US</h2>
          <p class="contact-subtitle">Fill out the form below and we'll get back to you as soon as possible.</p>
        </div>
        
        <form id="contactForm" class="contact-form" action="https://formsubmit.co/info@linksco.co.za" method="POST">
          <input type="text" name="name" placeholder="Your name" required>
          <input type="email" name="email" placeholder="Your email" required>
          <textarea name="message" placeholder="Your message" required></textarea>
          
          <input type="hidden" name="_subject" value="New enquiry from Linksco Website">
          <input type="hidden" name="_captcha" value="false">
          <input type="text" name="_honey" style="display:none">

          <button type="submit" class="btn">SEND MESSAGE</button>
          
          <div id="successMessage" class="success-message">
            Your message has been sent successfully. We will get back to you soon!
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer-section">
    <div class="footer-container">
      <p class="copyright-btn">© <span id="year"></span> Linksco. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const form = document.getElementById('contactForm');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'SENDING...';

      const formData = new FormData(form);
      
      try {
        await fetch(form.action, {
          method: 'POST',
          body: formData
        });
        
        form.reset();
        successMessage.classList.add('show');
        submitBtn.style.display = 'none';
        
        setTimeout(() => {
          successMessage.classList.remove('show');
          submitBtn.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'SEND MESSAGE';
        }, 5000);
        
      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'SEND MESSAGE';
        alert('Something went wrong. Please try again.');
      }
    });

    document.querySelectorAll('a[href^="http"], a.logo').forEach(link => {
      link.addEventListener('click', function(e) {
        const href = this.href;
        if (href.startsWith('mailto:') || href.startsWith('#')) { return; }
        e.preventDefault();
        document.body.style.opacity = '0.7';
        setTimeout(() => { window.location.href = href; }, 1000);
      });
    });
    document.addEventListener('contextmenu', e => { if(e.target.tagName === 'IMG') e.preventDefault(); });
    document.addEventListener('dragstart', e => { if(e.target.tagName === 'IMG') e.preventDefault(); });
  </script>
</body>
</html>
